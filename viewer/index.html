<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Architect: Interactive Benchmark & Gallery</title>
  <style>
    :root {
      --bg-dark: #090b10;
      --panel-bg: #121620;
      --card-bg: #181d2a;
      --border-color: #262e40;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --wireframe-stroke: #00ffcc;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .tag {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #041019;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn, .select-input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.48rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn:hover, .select-input:hover {
      background: #202738;
      border-color: #3b4763;
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #041019;
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      width: 500px;
      max-width: 100%;
    }

    .card-header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-baseline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .badge-architect {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .canvas-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
      overflow: hidden;
      background: #07090e;
    }

    .bg-mode-dark { background-color: #07090e; }
    .bg-mode-light { background-color: #f8fafc; }
    .bg-mode-checker {
      background-color: #141824;
      background-image: 
        linear-gradient(45deg, #1f2538 25%, transparent 25%), 
        linear-gradient(-45deg, #1f2538 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1f2538 75%), 
        linear-gradient(-45deg, transparent 75%, #1f2538 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Wireframe Mode */
    .wireframe-active .svg-container svg * {
      fill: none !important;
      stroke: var(--wireframe-stroke) !important;
      stroke-width: 1px !important;
      filter: none !important;
    }

    /* Mathematical Overlay Grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    .grid-active .grid-overlay { display: block; }

    .card-footer {
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.25);
      padding: 0.75rem 1.25rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }

    .btn-copy { padding: 0.35rem 0.6rem; font-size: 0.75rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>SVG Architect</h1>
      <span class="tag">Benchmark Engine</span>
    </div>

    <div class="toolbar">
      <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">Preset Subject:</label>
      <select id="presetSelector" class="select-input" onchange="loadPreset(this.value)">
        <option value="bugs">Bugs Bunny (Looney Tunes Classic)</option>
        <option value="arthur">Arthur Morgan (RDR2 Poster Art)</option>
        <option value="spiderman">Spider-Man (Queens Web-Warrior)</option>
        <option value="batman">Batman (The Dark Knight Cowl)</option>
        <option value="garfield">Garfield (Classic Comic Art)</option>
      </select>

      <button id="toggleGrid" class="btn" onclick="toggleInspector('grid')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Grid Overlay
      </button>

      <button id="toggleWireframe" class="btn" onclick="toggleInspector('wireframe')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a15.3 15.3 0 0 1 4 9 15.3 15.3 0 0 1-4 9 15.3 15.3 0 0 1-4-9 15.3 15.3 0 0 1 4-9z"/></svg>
        Wireframe Mode
      </button>

      <select id="bgSelector" class="select-input" onchange="changeBackground(this.value)">
        <option value="bg-mode-dark">Canvas: Dark</option>
        <option value="bg-mode-light">Canvas: Light</option>
        <option value="bg-mode-checker">Canvas: Checkerboard</option>
      </select>
    </div>
  </header>

  <main>
    <!-- Card 1: Stage A Baseline -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>Stage A: Raw LLM Output</span>
          <span class="badge-baseline">Zero-Shot Baseline</span>
        </div>
        <button class="btn btn-copy" onclick="copySvgCode('containerA', this)">Copy SVG</button>
      </div>

      <div class="canvas-wrapper bg-mode-dark" id="wrapperA">
        <svg class="grid-overlay" viewBox="0 0 500 500">
          <defs>
            <pattern id="grid16A" width="16" height="16" patternUnits="userSpaceOnUse">
              <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            </pattern>
            <pattern id="grid64A" width="64" height="64" patternUnits="userSpaceOnUse">
              <rect width="64" height="64" fill="url(#grid16A)"/>
              <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="500" height="500" fill="url(#grid64A)"/>
          <line x1="250" y1="0" x2="250" y2="500" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <line x1="0" y1="250" x2="500" y2="250" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <circle cx="250" cy="250" r="3.5" fill="#ef4444"/>
        </svg>

        <div class="svg-container" id="containerA"></div>
      </div>

      <div class="card-footer">
        <div class="metric-item">
          <span class="metric-label">DOM Nodes</span>
          <span class="metric-value" id="nodesA">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Defs / Gradients</span>
          <span class="metric-value" id="defsA">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Payload Size</span>
          <span class="metric-value" id="sizeA">-</span>
        </div>
      </div>
    </div>

    <!-- Card 2: Stage B Distilled Architect System -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>Stage B: SVG Architect</span>
          <span class="badge-architect">Spatial Blueprint Engine</span>
        </div>
        <button class="btn btn-copy" onclick="copySvgCode('containerB', this)">Copy SVG</button>
      </div>

      <div class="canvas-wrapper bg-mode-dark" id="wrapperB">
        <svg class="grid-overlay" viewBox="0 0 500 500">
          <defs>
            <pattern id="grid16B" width="16" height="16" patternUnits="userSpaceOnUse">
              <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            </pattern>
            <pattern id="grid64B" width="64" height="64" patternUnits="userSpaceOnUse">
              <rect width="64" height="64" fill="url(#grid16B)"/>
              <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="500" height="500" fill="url(#grid64B)"/>
          <line x1="250" y1="0" x2="250" y2="500" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <line x1="0" y1="250" x2="500" y2="250" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <circle cx="250" cy="250" r="3.5" fill="#ef4444"/>
        </svg>

        <div class="svg-container" id="containerB"></div>
      </div>

      <div class="card-footer">
        <div class="metric-item">
          <span class="metric-label">DOM Nodes</span>
          <span class="metric-value" id="nodesB">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Defs / Gradients</span>
          <span class="metric-value" id="defsB">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Payload Size</span>
          <span class="metric-value" id="sizeB">-</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const PRESETS = {"bugs": {"title": "Bugs Bunny (Looney Tunes Classic)", "baseline": "<!-- Stage A: Raw/Zero-Shot Bugs Bunny Baseline -->\n          <svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">\n            <g id=\"bugs-baseline\" stroke=\"#000000\" stroke-width=\"3\" stroke-linejoin=\"round\">\n              <!-- Looney Tunes Red Target -->\n              <rect width=\"500\" height=\"500\" fill=\"#1e293b\"/>\n              <circle cx=\"250\" cy=\"250\" r=\"220\" fill=\"#dc2626\"/>\n              <circle cx=\"250\" cy=\"250\" r=\"160\" fill=\"#ea580c\"/>\n              <circle cx=\"250\" cy=\"250\" r=\"100\" fill=\"#fbbf24\"/>\n\n              <!-- Ears (Freehand flat grey & pink) -->\n              <path d=\"M 210,100 C 180,20 160,10 170,10 C 180,10 210,50 225,100 Z\" fill=\"#94a3b8\"/>\n              <path d=\"M 180,30 C 185,25 200,60 215,95\" stroke=\"#f472b6\" stroke-width=\"6\"/>\n\n              <path d=\"M 275,100 C 290,50 320,10 330,10 C 340,10 320,20 290,100 Z\" fill=\"#94a3b8\"/>\n              <path d=\"M 320,30 C 315,25 300,60 285,95\" stroke=\"#f472b6\" stroke-width=\"6\"/>\n\n              <!-- Body -->\n              <path d=\"M 200,280 L 170,420 L 330,420 L 300,280 Z\" fill=\"#94a3b8\"/>\n              <ellipse cx=\"250\" cy=\"350\" rx=\"35\" ry=\"50\" fill=\"#ffffff\"/>\n\n              <!-- Head -->\n              <ellipse cx=\"250\" cy=\"180\" rx=\"60\" ry=\"70\" fill=\"#94a3b8\"/>\n              <!-- Cheeks -->\n              <circle cx=\"205\" cy=\"210\" r=\"30\" fill=\"#ffffff\"/>\n              <circle cx=\"295\" cy=\"210\" r=\"30\" fill=\"#ffffff\"/>\n\n              <!-- Buck Teeth -->\n              <rect x=\"242\" y=\"225\" width=\"8\" height=\"15\" fill=\"#ffffff\"/>\n              <rect x=\"250\" y=\"225\" width=\"8\" height=\"15\" fill=\"#ffffff\"/>\n\n              <!-- Nose -->\n              <ellipse cx=\"250\" cy=\"195\" rx=\"8\" ry=\"6\" fill=\"#f472b6\"/>\n\n              <!-- Eyes -->\n              <ellipse cx=\"235\" cy=\"150\" rx=\"10\" ry=\"18\" fill=\"#ffffff\"/>\n              <circle cx=\"238\" cy=\"152\" r=\"4\" fill=\"#000000\"/>\n              <ellipse cx=\"265\" cy=\"150\" rx=\"10\" ry=\"18\" fill=\"#ffffff\"/>\n              <circle cx=\"262\" cy=\"152\" r=\"4\" fill=\"#000000\"/>\n\n              <!-- Carrot -->\n              <polygon points=\"320,280 380,240 370,230\" fill=\"#ea580c\"/>\n              <path d=\"M 380,240 L 405,225\" stroke=\"#22c55e\" stroke-width=\"4\"/>\n            </g>\n          </svg>", "architect": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 500\" width=\"100%\" height=\"100%\">\n  <defs>\n    <!-- Radial Bullseye Background Gradients -->\n    <radialGradient id=\"bullseyeRed\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#b91c1c\"/>\n      <stop offset=\"60%\" stop-color=\"#991b1b\"/>\n      <stop offset=\"100%\" stop-color=\"#450a0a\"/>\n    </radialGradient>\n    <radialGradient id=\"ringOrange\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#fb923c\"/>\n      <stop offset=\"100%\" stop-color=\"#ea580c\"/>\n    </radialGradient>\n    <radialGradient id=\"ringYellow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#fde047\"/>\n      <stop offset=\"100%\" stop-color=\"#eab308\"/>\n    </radialGradient>\n    <radialGradient id=\"bullseyeCenterHole\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n      <stop offset=\"0%\" stop-color=\"#1e1b4b\"/>\n      <stop offset=\"85%\" stop-color=\"#0f172a\"/>\n      <stop offset=\"100%\" stop-color=\"#020617\"/>\n    </radialGradient>\n\n    <!-- Character Shading: Classic Looney Tunes Warm Gray -->\n    <linearGradient id=\"bunnyGrayLit\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n      <stop offset=\"0%\" stop-color=\"#a6b1c9\"/>\n      <stop offset=\"100%\" stop-color=\"#808ea4\"/>\n    </linearGradient>\n    <linearGradient id=\"bunnyGrayShadow\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n      <stop offset=\"0%\" stop-color=\"#6b788e\"/>\n      <stop offset=\"100%\" stop-color=\"#4d5768\"/>\n    </linearGradient>\n\n    <!-- White Fur Shading (Cheeks, Belly, Gloves) -->\n    <linearGradient id=\"whiteFurGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#ffffff\"/>\n      <stop offset=\"80%\" stop-color=\"#f1f5f9\"/>\n      <stop offset=\"100%\" stop-color=\"#cbd5e1\"/>\n    </linearGradient>\n\n    <!-- Ear Wells & Nose: Vibrant Coral Pink -->\n    <linearGradient id=\"earPinkLit\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#fda4af\"/>\n      <stop offset=\"100%\" stop-color=\"#f43f5e\"/>\n    </linearGradient>\n    <linearGradient id=\"bunnyNose\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#fb7185\"/>\n      <stop offset=\"100%\" stop-color=\"#e11d48\"/>\n    </linearGradient>\n\n    <!-- Crunchy Carrot Shading -->\n    <linearGradient id=\"carrotGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#fb923c\"/>\n      <stop offset=\"40%\" stop-color=\"#ea580c\"/>\n      <stop offset=\"100%\" stop-color=\"#c2410c\"/>\n    </linearGradient>\n    <linearGradient id=\"leafGrad\" x1=\"0%\" y1=\"100%\" x2=\"0%\" y2=\"0%\">\n      <stop offset=\"0%\" stop-color=\"#15803d\"/>\n      <stop offset=\"100%\" stop-color=\"#4ade80\"/>\n    </linearGradient>\n\n    <!-- Cartoon Cel Dropshadow -->\n    <filter id=\"looneyShadow\" x=\"-15%\" y=\"-15%\" width=\"130%\" height=\"130%\">\n      <feDropShadow dx=\"3\" dy=\"5\" stdDeviation=\"4\" flood-color=\"#020617\" flood-opacity=\"0.55\"/>\n    </filter>\n  </defs>\n\n  <!-- =================================================== -->\n  <!-- LAYER 0: CLASSIC LOONEY TUNES BULLSEYE BACKDROP    -->\n  <!-- =================================================== -->\n  <g id=\"layer0-bullseye-bg\">\n    <rect width=\"500\" height=\"500\" fill=\"url(#bullseyeRed)\"/>\n    <circle cx=\"250\" cy=\"250\" r=\"225\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"24\"/>\n    <circle cx=\"250\" cy=\"250\" r=\"185\" fill=\"none\" stroke=\"url(#ringOrange)\" stroke-width=\"22\"/>\n    <circle cx=\"250\" cy=\"250\" r=\"150\" fill=\"none\" stroke=\"url(#ringYellow)\" stroke-width=\"18\"/>\n    <circle cx=\"250\" cy=\"250\" r=\"120\" fill=\"none\" stroke=\"url(#ringOrange)\" stroke-width=\"16\"/>\n    <circle cx=\"250\" cy=\"250\" r=\"95\" fill=\"url(#bullseyeCenterHole)\" stroke=\"#dc2626\" stroke-width=\"10\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 1: TALL RABBIT EARS (BACK SILHOUETTE)         -->\n  <!-- Left [165, 18] <-> Right [335, 18] (500 - X)       -->\n  <!-- =================================================== -->\n  <g id=\"layer1-ears\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">\n    <!-- LEFT TALL RABBIT EAR -->\n    <path d=\"M 215,85 C 190,50 145,35 165,18 C 188,2 215,35 230,85 Z\" fill=\"url(#bunnyGrayLit)\"/>\n    <!-- Left Inner Pink Well -->\n    <path d=\"M 210,75 C 192,48 162,35 174,25 C 188,18 206,42 220,75 Z\" fill=\"url(#earPinkLit)\" stroke=\"none\"/>\n\n    <!-- RIGHT TALL RABBIT EAR (EXACT MIRROR: 500 - X) -->\n    <path d=\"M 285,85 C 310,50 355,35 335,18 C 312,2 285,35 270,85 Z\" fill=\"url(#bunnyGrayShadow)\"/>\n    <!-- Right Inner Pink Well -->\n    <path d=\"M 290,75 C 308,48 338,35 326,25 C 312,18 294,42 280,75 Z\" fill=\"url(#earPinkLit)\" stroke=\"none\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 2: ANATOMICAL NECK & COLLAR RUFF (SEAM LOCK)  -->\n  <!-- Bridge extends Y=[185 to 295], overlapping cranium  -->\n  <!-- base and shoulder girdle: ZERO-GAP GUARANTEED!      -->\n  <!-- =================================================== -->\n  <g id=\"layer2-neck-seam\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">\n    <!-- Slender Gray Neck Column (Left Lit Half) -->\n    <path d=\"M 250,185 L 222,185 L 220,240 L 185,290 L 250,290 Z\" fill=\"url(#bunnyGrayLit)\"/>\n    <!-- Slender Gray Neck Column (Right Shadow Half: Mirror 500 - X) -->\n    <path d=\"M 250,185 L 278,185 L 280,240 L 315,290 L 250,290 Z\" fill=\"url(#bunnyGrayShadow)\"/>\n\n    <!-- Classic Warner Bros Fur Collar / Throat Ruff Under Chin -->\n    <!-- Locks head directly into chest with organic tufts -->\n    <path d=\"M 250,225 \n             C 235,230 215,242 220,256 \n             C 228,260 240,268 250,278 \n             C 260,268 272,260 280,256 \n             C 285,242 265,230 250,225 Z\" \n          fill=\"url(#whiteFurGrad)\"/>\n    <!-- Collar Center Accent Crease -->\n    <line x1=\"250\" y1=\"240\" x2=\"250\" y2=\"272\" stroke=\"#94a3b8\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 3: SLENDER BODY, LEGS & WHITE TUMMY FUR       -->\n  <!-- Shoulders [185, 290] <-> [315, 290]                 -->\n  <!-- =================================================== -->\n  <g id=\"layer3-torso-body\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">\n    <!-- Left Torso Half (Lit) -->\n    <path d=\"M 250,285 L 185,290 L 175,395 L 210,480 L 250,485 Z\" fill=\"url(#bunnyGrayLit)\"/>\n    <!-- Right Torso Half (Shadow: Mirror 500 - X) -->\n    <path d=\"M 250,285 L 315,290 L 325,395 L 290,480 L 250,485 Z\" fill=\"url(#bunnyGrayShadow)\"/>\n\n    <!-- Fluffy White Oval Tummy Patch -->\n    <ellipse cx=\"250\" cy=\"385\" rx=\"42\" ry=\"72\" fill=\"url(#whiteFurGrad)\" stroke=\"#090d16\" stroke-width=\"4\"/>\n\n    <!-- Relaxed Rabbit Feet Base -->\n    <path d=\"M 170,480 C 135,480 120,495 140,500 L 225,500 C 235,492 215,480 170,480 Z\" fill=\"url(#whiteFurGrad)\"/>\n    <path d=\"M 330,480 C 365,480 380,495 360,500 L 275,500 C 265,492 285,480 330,480 Z\" fill=\"url(#whiteFurGrad)\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 4: ARMS, WHITE GLOVES & CRUNCHY CARROT        -->\n  <!-- =================================================== -->\n  <g id=\"layer4-arms-carrot\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">\n    <!-- Left Arm (Hand on Hip with Attitude) -->\n    <path d=\"M 185,290 C 145,320 135,365 155,405\" fill=\"none\"/>\n    <!-- Left 4-Fingered White Cartoon Glove -->\n    <ellipse cx=\"158\" cy=\"405\" rx=\"16\" ry=\"14\" fill=\"url(#whiteFurGrad)\"/>\n    <!-- Glove Dart Seams -->\n    <line x1=\"152\" y1=\"398\" x2=\"164\" y2=\"410\" stroke=\"#64748b\" stroke-width=\"2\"/>\n\n    <!-- Right Arm (Raised casually holding the carrot) -->\n    <path d=\"M 315,290 C 355,310 380,285 365,245\" fill=\"none\"/>\n\n    <!-- THE CRUNCHY CARROT! -->\n    <g id=\"carrot-prop\">\n      <!-- Carrot Body -->\n      <polygon points=\"352,248 425,185 415,172 345,236\" fill=\"url(#carrotGrad)\"/>\n      <!-- Carrot Crunchy Horizontal Grooves -->\n      <line x1=\"365\" y1=\"230\" x2=\"378\" y2=\"236\" stroke=\"#9a3412\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n      <line x1=\"385\" y1=\"212\" x2=\"398\" y2=\"218\" stroke=\"#9a3412\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n      <line x1=\"402\" y1=\"195\" x2=\"412\" y2=\"200\" stroke=\"#9a3412\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n\n      <!-- Leafy Green Carrot Top Sprig -->\n      <path d=\"M 420,178 C 435,160 455,165 445,150 C 430,158 432,142 418,155 C 414,142 398,152 412,172 Z\" fill=\"url(#leafGrad)\"/>\n    </g>\n\n    <!-- Right Gloved Hand Gripping the Carrot -->\n    <ellipse cx=\"355\" cy=\"242\" rx=\"15\" ry=\"13\" fill=\"url(#whiteFurGrad)\"/>\n    <circle cx=\"348\" cy=\"236\" r=\"6\" fill=\"url(#whiteFurGrad)\"/>\n    <circle cx=\"355\" cy=\"232\" r=\"6\" fill=\"url(#whiteFurGrad)\"/>\n    <circle cx=\"363\" cy=\"235\" r=\"6\" fill=\"url(#whiteFurGrad)\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 5: HEAD CRANIUM, FLUFFY CHEEKS & SMIRK        -->\n  <!-- =================================================== -->\n  <g id=\"layer5-head-face\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">\n    <!-- Main Upper Head Skull -->\n    <path d=\"M 215,85 C 230,78 270,78 285,85 C 300,120 300,165 285,185 L 215,185 C 200,165 200,120 215,85 Z\" fill=\"url(#bunnyGrayLit)\"/>\n\n    <!-- Left Fluffy Tufted Cheek -->\n    <path d=\"M 220,175 \n             C 180,175 140,195 160,215 \n             C 145,220 162,235 175,235 \n             C 185,250 215,245 235,240 Z\" \n          fill=\"url(#whiteFurGrad)\"/>\n\n    <!-- Right Fluffy Tufted Cheek (Mirror: 500 - X) -->\n    <path d=\"M 280,175 \n             C 320,175 360,195 340,215 \n             C 355,220 338,235 325,235 \n             C 315,250 285,245 265,240 Z\" \n          fill=\"url(#whiteFurGrad)\"/>\n\n    <!-- Cheerful Open Smirk / Mouth Line -->\n    <path d=\"M 218,212 C 235,238 265,238 282,212\" fill=\"#7f1d1d\" stroke=\"#090d16\" stroke-width=\"4\"/>\n\n    <!-- BUGS BUNNY'S FAMOUS BUCK TEETH! -->\n    <!-- Left Incisor -->\n    <rect x=\"238\" y=\"215\" width=\"11\" height=\"18\" rx=\"2\" fill=\"#ffffff\" stroke=\"#090d16\" stroke-width=\"3.5\"/>\n    <!-- Right Incisor -->\n    <rect x=\"251\" y=\"215\" width=\"11\" height=\"18\" rx=\"2\" fill=\"#ffffff\" stroke=\"#090d16\" stroke-width=\"3.5\"/>\n\n    <!-- Split Muzzle Bulb Lobes -->\n    <ellipse cx=\"235\" cy=\"195\" rx=\"22\" ry=\"16\" fill=\"url(#whiteFurGrad)\"/>\n    <ellipse cx=\"265\" cy=\"195\" rx=\"22\" ry=\"16\" fill=\"url(#whiteFurGrad)\"/>\n\n    <!-- Whisker Dots -->\n    <circle cx=\"225\" cy=\"192\" r=\"2.5\" fill=\"#090d16\" stroke=\"none\"/>\n    <circle cx=\"218\" cy=\"198\" r=\"2.5\" fill=\"#090d16\" stroke=\"none\"/>\n    <circle cx=\"226\" cy=\"204\" r=\"2.5\" fill=\"#090d16\" stroke=\"none\"/>\n\n    <circle cx=\"275\" cy=\"192\" r=\"2.5\" fill=\"#090d16\" stroke=\"none\"/>\n    <circle cx=\"282\" cy=\"198\" r=\"2.5\" fill=\"#090d16\" stroke=\"none\"/>\n    <circle cx=\"274\" cy=\"204\" r=\"2.5\" fill=\"#090d16\" stroke=\"none\"/>\n\n    <!-- Cute Oval Pink Rabbit Button Nose -->\n    <ellipse cx=\"250\" cy=\"178\" rx=\"12\" ry=\"8\" fill=\"url(#bunnyNose)\" stroke=\"#090d16\" stroke-width=\"3.5\"/>\n    <!-- Specular Nose Highlight -->\n    <ellipse cx=\"247\" cy=\"176\" rx=\"4\" ry=\"2\" fill=\"#ffffff\" opacity=\"0.8\" stroke=\"none\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 6: MISCHIEVOUS CARTOON EYES & WHISKERS        -->\n  <!-- Left Eye [232, 138] <-> Right Eye [268, 138]        -->\n  <!-- =================================================== -->\n  <g id=\"layer6-eyes\">\n    <!-- Left Eye Sclera (Tall Egg Shape) -->\n    <ellipse cx=\"232\" cy=\"138\" rx=\"16\" ry=\"30\" fill=\"#ffffff\" stroke=\"#090d16\" stroke-width=\"4\"/>\n    <!-- Left Eyelid / Brow Curve (Slight smug half-lid) -->\n    <path d=\"M 218,126 Q 232,134 246,126\" fill=\"none\" stroke=\"#090d16\" stroke-width=\"3.5\"/>\n    <!-- Left Mischievous Pupil (Gazing toward viewer/carrot) -->\n    <ellipse cx=\"236\" cy=\"142\" rx=\"7\" ry=\"11\" fill=\"#090d16\"/>\n    <circle cx=\"234\" cy=\"138\" r=\"2.5\" fill=\"#ffffff\"/>\n\n    <!-- Right Eye Sclera (Exact Mirror: 500 - X) -->\n    <ellipse cx=\"268\" cy=\"138\" rx=\"16\" ry=\"30\" fill=\"#ffffff\" stroke=\"#090d16\" stroke-width=\"4\"/>\n    <!-- Right Eyelid / Brow Curve -->\n    <path d=\"M 254,126 Q 268,134 282,126\" fill=\"none\" stroke=\"#090d16\" stroke-width=\"3.5\"/>\n    <!-- Right Mischievous Pupil -->\n    <ellipse cx=\"264\" cy=\"142\" rx=\"7\" ry=\"11\" fill=\"#090d16\"/>\n    <circle cx=\"262\" cy=\"138\" r=\"2.5\" fill=\"#ffffff\"/>\n\n    <!-- Long Springy Whiskers -->\n    <line x1=\"205\" y1=\"195\" x2=\"140\" y2=\"185\" stroke=\"#090d16\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n    <line x1=\"205\" y1=\"202\" x2=\"135\" y2=\"208\" stroke=\"#090d16\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n\n    <line x1=\"295\" y1=\"195\" x2=\"360\" y2=\"185\" stroke=\"#090d16\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n    <line x1=\"295\" y1=\"202\" x2=\"365\" y2=\"208\" stroke=\"#090d16\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n  </g>\n</svg>"}, "arthur": {"title": "Arthur Morgan (RDR2 Poster Art)", "baseline": "<!-- Stage A: Raw/Zero-Shot Arthur Morgan Baseline -->\n          <svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">\n            <g id=\"arthur-baseline\" stroke=\"#1c1917\" stroke-width=\"3\" stroke-linejoin=\"round\">\n              <!-- RDR2 Sunset Backdrop -->\n              <rect width=\"500\" height=\"500\" fill=\"#7f1d1d\"/>\n              <circle cx=\"250\" cy=\"250\" r=\"190\" fill=\"#ea580c\"/>\n\n              <!-- Coat & Shoulders -->\n              <path d=\"M 50,480 L 150,360 L 350,360 L 450,480 L 480,500 L 20,500 Z\" fill=\"#92400e\"/>\n              <!-- Blue Shirt -->\n              <polygon points=\"210,330 250,360 290,330 280,450 220,450\" fill=\"#0284c7\"/>\n              <!-- Red Bandana -->\n              <polygon points=\"215,320 250,365 285,320\" fill=\"#dc2626\"/>\n\n              <!-- Face & Beard -->\n              <path d=\"M 180,180 L 175,260 L 210,315 L 250,325 L 290,315 L 325,260 L 320,180 Z\" fill=\"#fed7aa\"/>\n              <path d=\"M 185,250 C 190,310 230,325 250,325 C 270,325 310,310 315,250 Z\" fill=\"#78350f\"/>\n              <!-- Mustache -->\n              <path d=\"M 220,260 Q 250,250 280,260 Q 250,275 220,260 Z\" fill=\"#451a03\"/>\n\n              <!-- Eyes & Nose -->\n              <ellipse cx=\"215\" cy=\"205\" rx=\"8\" ry=\"5\" fill=\"#ffffff\"/>\n              <circle cx=\"215\" cy=\"205\" r=\"3\" fill=\"#000000\"/>\n              <ellipse cx=\"285\" cy=\"205\" rx=\"8\" ry=\"5\" fill=\"#ffffff\"/>\n              <circle cx=\"285\" cy=\"205\" r=\"3\" fill=\"#000000\"/>\n              <polygon points=\"245,200 255,200 258,240 242,240\" fill=\"#fbcfe8\"/>\n\n              <!-- Cowboy Hat (Flat Brown) -->\n              <!-- Crown -->\n              <path d=\"M 190,140 L 195,70 L 250,60 L 305,70 L 310,140 Z\" fill=\"#451a03\"/>\n              <!-- Curved Brim -->\n              <path d=\"M 70,160 Q 250,130 430,160 Q 250,185 70,160 Z\" fill=\"#291307\"/>\n            </g>\n          </svg>", "architect": "<svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <!-- RDR2 Poster Palette Gradients -->\n    <radialGradient id=\"rdrBlazingSun\" cx=\"50%\" cy=\"32%\" r=\"48%\">\n      <stop offset=\"0%\" stop-color=\"#fffbeb\"/>\n      <stop offset=\"20%\" stop-color=\"#ffae00\"/>\n      <stop offset=\"55%\" stop-color=\"#ff9d00\"/>\n      <stop offset=\"85%\" stop-color=\"#cc0e14\"/>\n      <stop offset=\"100%\" stop-color=\"#a8070c\"/>\n    </radialGradient>\n\n    <linearGradient id=\"skyCrimsonGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#7a0307\"/>\n      <stop offset=\"40%\" stop-color=\"#a8070c\"/>\n      <stop offset=\"85%\" stop-color=\"#cc0e14\"/>\n      <stop offset=\"100%\" stop-color=\"#800509\"/>\n    </linearGradient>\n\n    <!-- Coat Leather Gradients -->\n    <linearGradient id=\"coatLeatherLit\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#2d1712\"/>\n      <stop offset=\"50%\" stop-color=\"#1a0d0a\"/>\n      <stop offset=\"100%\" stop-color=\"#0d0707\"/>\n    </linearGradient>\n\n    <linearGradient id=\"coatLeatherShadow\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#1a0d0a\"/>\n      <stop offset=\"70%\" stop-color=\"#0d0707\"/>\n      <stop offset=\"100%\" stop-color=\"#050303\"/>\n    </linearGradient>\n\n    <!-- Hat Distressed Leather -->\n    <linearGradient id=\"hatCrownGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#301c16\"/>\n      <stop offset=\"40%\" stop-color=\"#1f120e\"/>\n      <stop offset=\"100%\" stop-color=\"#0d0707\"/>\n    </linearGradient>\n\n    <!-- Sunburned Skin Facets -->\n    <linearGradient id=\"skinSunburnedLit\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#f59e6b\"/>\n      <stop offset=\"45%\" stop-color=\"#d96b38\"/>\n      <stop offset=\"100%\" stop-color=\"#a63d1a\"/>\n    </linearGradient>\n\n    <linearGradient id=\"skinSunburnedShadow\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#a63d1a\"/>\n      <stop offset=\"55%\" stop-color=\"#8c2514\"/>\n      <stop offset=\"100%\" stop-color=\"#4a1107\"/>\n    </linearGradient>\n\n    <!-- Twisted Rope Hatband -->\n    <linearGradient id=\"ropeGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n      <stop offset=\"0%\" stop-color=\"#bf8c52\"/>\n      <stop offset=\"50%\" stop-color=\"#9e7340\"/>\n      <stop offset=\"100%\" stop-color=\"#694a24\"/>\n    </linearGradient>\n\n    <!-- High-Contrast Poster Drop Shadow -->\n    <filter id=\"rdrPosterShadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n      <feDropShadow dx=\"0\" dy=\"16\" stdDeviation=\"14\" flood-color=\"#050202\" flood-opacity=\"0.95\"/>\n    </filter>\n  </defs>\n\n  <!-- =================================================== -->\n  <!-- LAYER 0: ATMOSPHERE & RDR2 POSTER SUNSET            -->\n  <!-- =================================================== -->\n  <rect width=\"500\" height=\"500\" fill=\"url(#skyCrimsonGrad)\"/>\n  <circle cx=\"250\" cy=\"210\" r=\"195\" fill=\"url(#rdrBlazingSun)\"/>\n\n  <!-- Distant Pine Tree & Mesa Horizon Silhouettes -->\n  <g fill=\"#210305\" opacity=\"0.85\">\n    <polygon points=\"0,325 75,295 130,318 205,282 250,298 320,270 395,305 450,285 500,310 500,370 0,370\"/>\n    <polygon points=\"40,305 46,285 52,305\"/>\n    <polygon points=\"48,300 55,278 62,300\"/>\n    <polygon points=\"58,304 63,288 68,304\"/>\n    <polygon points=\"175,295 181,275 187,295\"/>\n    <polygon points=\"183,290 190,268 197,290\"/>\n    <polygon points=\"340,282 346,262 352,282\"/>\n    <polygon points=\"348,278 355,255 362,278\"/>\n  </g>\n\n  <!-- Flying Outlaw Vultures -->\n  <path d=\"M 95,95 Q 105,87 115,95 Q 125,87 135,95 Q 115,91 95,95 Z\" fill=\"#140203\"/>\n  <path d=\"M 370,80 Q 378,73 386,80 Q 394,73 402,80 Q 386,76 370,80 Z\" fill=\"#140203\"/>\n\n  <!-- =================================================== -->\n  <!-- LAYER 1: COAT & BANDANA BASE                        -->\n  <!-- Anchors: Shoulders [65, 430] <-> [435, 430]         -->\n  <!-- Bandana V-Tip: [250, 425]                           -->\n  <!-- =================================================== -->\n  <g id=\"layer1-coat-bandana\" filter=\"url(#rdrPosterShadow)\">\n    <!-- Left Shoulder (Lit) -->\n    <polygon points=\"155,345 65,430 0,500 215,500 205,385\" \n             fill=\"url(#coatLeatherLit)\" \n             stroke=\"#0d0707\" \n             stroke-width=\"4\" \n             stroke-linejoin=\"round\"/>\n\n    <!-- Right Shoulder (Shadow: Mirror 500 - X) -->\n    <polygon points=\"345,345 435,430 500,500 285,500 295,385\" \n             fill=\"url(#coatLeatherShadow)\" \n             stroke=\"#0d0707\" \n             stroke-width=\"4\" \n             stroke-linejoin=\"round\"/>\n\n    <!-- Lapels -->\n    <polygon points=\"155,345 190,445 220,385 175,345\" fill=\"#2d1712\" stroke=\"#0d0707\" stroke-width=\"2.5\"/>\n    <polygon points=\"345,345 310,445 280,385 325,345\" fill=\"#150a08\" stroke=\"#0d0707\" stroke-width=\"2.5\"/>\n\n    <!-- Blue Shirt Collar -->\n    <polygon points=\"215,355 250,370 285,355 275,440 225,440\" fill=\"#1e3a5f\" stroke=\"#0d0707\" stroke-width=\"2\"/>\n\n    <!-- Black Neckerchief Bandana with Deep V-Tip [250, 425] -->\n    <polygon points=\"205,330 250,425 250,358 178,338\" \n             fill=\"#1a1214\" \n             stroke=\"#0d090a\" \n             stroke-width=\"3\" \n             stroke-linejoin=\"round\"/>\n\n    <polygon points=\"295,330 250,425 250,358 322,338\" \n             fill=\"#0d090a\" \n             stroke=\"#050304\" \n             stroke-width=\"3\" \n             stroke-linejoin=\"round\"/>\n\n    <path d=\"M 218,348 Q 242,388 250,425 Q 258,388 282,348\" fill=\"none\" stroke=\"#2b1c20\" stroke-width=\"2.5\"/>\n    <ellipse cx=\"250\" cy=\"355\" rx=\"8\" ry=\"6\" fill=\"#0d090a\" stroke=\"#000000\" stroke-width=\"2\"/>\n    <line x1=\"250\" y1=\"355\" x2=\"250\" y2=\"425\" stroke=\"#000000\" stroke-width=\"2.5\"/>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 2: NECK & LOWER FACE (RUGGED BEARD & JAW)     -->\n  <!-- Jaw Corners [190, 292] <-> [310, 292]               -->\n  <!-- Chin Bottom [250, 332]                              -->\n  <!-- =================================================== -->\n  <g id=\"layer2-neck-face\" filter=\"url(#rdrPosterShadow)\">\n    <polygon points=\"190,292 250,332 250,365 180,345\" fill=\"#a63d1a\" stroke=\"#0d0707\" stroke-width=\"2\"/>\n    <polygon points=\"310,292 250,332 250,365 320,345\" fill=\"#8c2514\" stroke=\"#0d0707\" stroke-width=\"2\"/>\n\n    <!-- Cheekbones: [182, 225] <-> [318, 225] -->\n    <polygon points=\"250,195 182,225 178,255 190,292 250,332\" \n             fill=\"url(#skinSunburnedLit)\" \n             stroke=\"#0d0707\" \n             stroke-width=\"3\" \n             stroke-linejoin=\"round\"/>\n\n    <polygon points=\"250,195 318,225 322,255 310,292 250,332\" \n             fill=\"url(#skinSunburnedShadow)\" \n             stroke=\"#0d0707\" \n             stroke-width=\"3\" \n             stroke-linejoin=\"round\"/>\n\n    <!-- Full Outlaw Beard (#24110c) -->\n    <path d=\"M 178,245 \n             L 190,292 \n             L 218,325 \n             L 250,332 \n             L 282,325 \n             L 310,292 \n             L 322,245 \n             C 310,278 285,302 250,302 \n             C 215,302 190,278 178,24 "250\" y1=\"210\" x2=\"348\" y2=\"235\"/>\n      <line x1=\"250\" y1=\"210\" x2=\"175\" y2=\"278\"/>\n      <line x1=\"250\" y1=\"210\" x2=\"325\" y2=\"278\"/>\n      <line x1=\"250\" y1=\"210\" x2=\"215\" y2=\"318\"/>\n      <line x1=\"250\" y1=\"210\" x2=\"285\" y2=\"318\"/>\n      <line x1=\"250\" y1=\"210\" x2=\"250\" y2=\"335\"/>\n    </g>\n\n    <!-- Concentric Web Rings -->\n    <g stroke=\"#111318\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.85\">\n      <path d=\"M 218,165 Q 234,172 250,172 Q 266,172 282,165\"/>\n      <path d=\"M 195,135 Q 222,148 250,148 Q 278,148 305,135\"/>\n      <path d=\"M 172,105 Q 211,122 250,122 Q 289,122 328,105\"/>\n      <path d=\"M 180,72 Q 215,95 250,95 Q 285,95 320,72\"/>\n      <path d=\"M 224,265 Q 237,258 250,258 Q 263,258 276,265\"/>\n      <path d=\"M 205,292 Q 227,282 250,282 Q 273,282 295,292\"/>\n      <path d=\"M 192,315 Q 221,304 250,304 Q 279,304 308,315\"/>\n    </g>\n  </g>\n\n  <!-- =================================================== -->\n  <!-- LAYER 6: ICONIC WHITE SPIDER-EYES / LENSES          -->\n  <!-- =================================================== -->\n  <g id=\"layer6-lenses\" filter=\"url(#eyeSpecularGlow)\">\n    <path d=\"M 236,220 \n             L 162,162 \n             C 152,198 165,244 238,236 \n             Z\" \n          fill=\"#0a0c10\" \n          stroke=\"#000000\" \n          stroke-width=\"5\" \n          stroke-linejoin=\"round\"/>\n\n    <path d=\"M 230,218 \n             L 172,172 \n             C 164,198 174,234 231,227 \n             Z\" \n          fill=\"url(#lensShadingLeft)\" \n          stroke=\"#334155\" \n          stroke-width=\"1.2\"/>\n\n    <path d=\"M 176,174 L 226,216\" \n          fill=\"none\" \n          stroke=\"#ffffff\" \n          stroke-width=\"2.5\" \n          stroke-linecap=\"round\"/>\n\n    <path d=\"M 264,220 \n             L 338,162 \n             C 348,198 335,244 262,236 \n             Z\" \n          fill=\"#0a0c10\" \n          stroke=\"#000000\" \n          stroke-width=\"5\" \n          stroke-linejoin=\"round\"/>\n\n    <path d=\"M 270,218 \n             L 328,172 \n             C 336,198 326,234 269,227 \n             Z\" \n          fill=\"url(#lensShadingRight)\" \n          stroke=\"#334155\" \n          stroke-width=\"1.2\"/>\n\n    <path d=\"M 324,174 L 274,216\" \n          fill=\"none\" \n          stroke=\"#ffffff\" \n          stroke-width=\"2.5\" \n          stroke-linecap=\"round\"/>\n  </g>\n</svg>"}, "batman": {"title": "Batman (The Dark Knight Cowl)", "baseline": "<svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">\n            <g id=\"batman-baseline\" stroke=\"#000000\" stroke-width=\"4\" stroke-linejoin=\"round\">\n              <!-- Background -->\n              <rect width=\"500\" height=\"500\" fill=\"#1e293b\"/>\n              <circle cx=\"250\" cy=\"250\" r=\"180\" fill=\"#334155\"/>\n\n              <!-- Cape / Shoulders -->\n              <path d=\"M 80,480 L 170,390 L 330,390 L 420,480 Z\" fill=\"#0f172a\"/>\n\n              <!-- Cowl & Ears (Freehand flat path with asymmetry) -->\n              <path d=\"M 150,110 L 140,40 L 180,95 L 320,95 L 360,40 L 350,110 L 375,250 L 340,380 L 160,380 L 125,250 Z\" \n                    fill=\"#18181b\"/>\n\n              <!-- Cowl Eye Openings -->\n              <polygon points=\"180,225 230,235 220,245 175,235\" fill=\"#ffffff\" stroke=\"#000000\" stroke-width=\"3\"/>\n              <polygon points=\"320,225 270,235 280,245 325,235\" fill=\"#ffffff\" stroke=\"#000000\" stroke-width=\"3\"/>\n\n              <!-- Nose Guard (Simple flat triangle) -->\n              <polygon points=\"250,220 235,275 265,275\" fill=\"#27272a\"/>\n\n              <!-- Mouth Cutout (Flat Skin Polygon) -->\n              <polygon points=\"185,295 240,285 260,285 315,295 305,385 250,405 195,385\" fill=\"#fed7aa\"/>\n\n              <!-- Mouth Line -->\n              <line x1=\"220\" y1=\"350\" x2=\"280\" y2=\"350\" stroke=\"#000000\" stroke-width=\"3\"/>\n              <!-- Chin line -->\n              <line x1=\"240\" y1=\"380\" x2=\"260\" y2=\"380\" stroke=\"#000000\" stroke-width=\"2\"/>\n            </g>\n          </svg>", "architect": "<svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">\n  <defs>\n    <!-- Lighting & Shading Gradients -->\n    <radialGradient id=\"moonAura\" cx=\"50%\" cy=\"45%\" r=\"55%\">\n      <stop offset=\"0%\" stop-color=\"#38bdf8\" stop-opacity=\"0.22\"/>\n      <stop offset=\"50%\" stop-color=\"#1e293b\" stop-opacity=\"0.12\"/>\n      <stop offset=\"100%\" stop-color=\"#020617\" stop-opacity=\"0\"/>\n    </radialGradient>\n\n    <!-- Cowl Faceted Armor Gradients (Left-Lit vs Right-Shadow) -->\n    <linearGradient id=\"cowlLitLeft\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#475569\"/>\n      <stop offset=\"45%\" stop-color=\"#334155\"/>\n      <stop offset=\"100%\" stop-color=\"#1e293b\"/>\n    </linearGradient>\n\n    <linearGradient id=\"cowlShadowRight\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#1e293b\"/>\n      <stop offset=\"50%\" stop-color=\"#0f172a\"/>\n      <stop offset=\"100%\" stop-color=\"#020617\"/>\n    </linearGradient>\n\n    <!-- Jaw Skin Tone Gradients (Left-Lit vs Right-Shadow) -->\n    <linearGradient id=\"skinLit\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#ffedd5\"/>\n      <stop offset=\"50%\" stop-color=\"#fed7aa\"/>\n      <stop offset=\"100%\" stop-color=\"#fba468\"/>\n    </linearGradient>\n\n    <linearGradient id=\"skinShadow\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n      <stop offset=\"0%\" stop-color=\"#ea580c\"/>\n      <stop offset=\"50%\" stop-color=\"#c2410c\"/>\n      <stop offset=\"100%\" stop-color=\"#7c2d12\"/>\n    </linearGradient>\n\n    <!-- Eye Radiant Glow -->\n    <linearGradient id=\"eyeGlowGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">\n      <stop offset=\"0%\" stop-color=\"#ffffff\"/>\n      <stop offset=\"40%\" stop-color=\"#e0f2fe\"/>\n      <stop offset=\"100%\" stop-color=\"#38bdf8\"/>\n    </linearGradient>\n\n    <!-- Filters: Deep Armor Drop Shadow & Eye Emission -->\n    <filter id=\"knightShadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n      <feDropShadow dx=\"0\" dy=\"16\" stdDeviation=\"14\" flood-color=\"#000000\" flood-opacity=\"0.8\"/>\n    </filter>\n\n    <filter id=\"eyeGlowFilter\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\">\n      <feGaussianBlur stdDeviation=\"6\" result=\"glow\"/>\n      <feMerge>\n        <feMergeNode in=\"glow\"/>\n        <feMergeNode in=\"SourceGraphic\"/>\n      </feMerge>\n    </filter>\n  </defs>\n\n  <!-- LAYER 0: ATMOSPHERE / BACKGROUND -->\n  <rect width=\"500\" height=\"500\" fill=\"#07090e\"/>\n  <circle cx=\"250\" cy=\"240\" r=\"210\" fill=\"url(#moonAura)\"/>\n\n  <!-- LAYER 1: BACK SILHOUETTE & CAPE MANTLE -->\n  <g filter=\"url(#knightShadow)\">\n    <polygon points=\"120,480 170,395 330,395 380,480 250,500\" fill=\"#0b0f19\" stroke=\"#000000\" stroke-width=\"4\"/>\n    <polygon points=\"120,480 170,395 250,440 210,490\" fill=\"#1e293b\"/>\n    <polygon points=\"380,480 330,395 250,440 290,490\" fill=\"#0f172a\"/>\n  </g>\n\n  <!-- LAYER 2: RAZOR BAT EARS (STRICT MATHEMATICAL SYMMETRY: X_R = 500 - X_L) -->\n  <g filter=\"url(#knightShadow)\">\n    <!-- Left Ear Outer Facet -->\n    <polygon points=\"140,140 155,30 195,115\" fill=\"url(#cowlLitLeft)\" stroke=\"#020617\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    <polygon points=\"155,30 175,110 195,115\" fill=\"#64748b\" opacity=\"0.4\"/>\n    <line x1=\"155\" y1=\"30\" x2=\"140\" y2=\"140\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.2\"/>\n\n    <!-- Right Ear Outer Facet (Exact Mirror: 500 - X) -->\n    <polygon points=\"360,140 345,30 305,115\" fill=\"url(#cowlShadowRight)\" stroke=\"#020617\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    <polygon points=\"345,30 325,110 305,115\" fill=\"#020617\" opacity=\"0.6\"/>\n    <line x1=\"345\" y1=\"30\" x2=\"360\" y2=\"140\" stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\"/>\n  </g>\n\n  <!-- LAYER 3: PRIMARY STRUCTURAL MASS (PLANE SPLIT DOWN CENTER X=250) -->\n  <g filter=\"url(#knightShadow)\">\n    <!-- Left-Lit Skull Facet -->\n    <polygon points=\"250,115 195,115 140,140 115,275 165,395 250,440\" \n             fill=\"url(#cowlLitLeft)\" \n             stroke=\"#020617\" \n             stroke-width=\"5\" \n             stroke-linejoin=\"round\"/>\n\n    <!-- Right-Shadow Skull Facet (Exact Mirror: X_R = 500 - X_L) -->\n    <polygon points=\"250,115 305,115 360,140 385,275 335,395 250,440\" \n             fill=\"url(#cowlShadowRight)\" \n             stroke=\"#020617\" \n             stroke-width=\"5\" \n             stroke-linejoin=\"round\"/>\n\n    <!-- Center Structural Apex Line (X=250) -->\n    <line x1=\"250\" y1=\"115\" x2=\"250\" y2=\"280\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n    <path d=\"M 140,140 L 115,275 L 165,395\" fill=\"none\" stroke=\"rgba(255,255,255,0.35)\" stroke-width=\"1.2\"/>\n  </g>\n\n  <!-- LAYER 4: BROW FURROW, NOSE GUARD & LOWER JAW ASSEMBLY -->\n  <!-- Chiseled Forehead Wedge -->\n  <polygon points=\"250,150 205,170 250,195 295,170\" fill=\"#0f172a\" stroke=\"#000000\" stroke-width=\"3\"/>\n  <polygon points=\"250,195 170,205 165,225 215,222 250,210\" fill=\"url(#cowlLitLeft)\" stroke=\"#000000\" stroke-width=\"3\"/>\n  <polygon points=\"250,195 330,205 335,225 285,222 250,210\" fill=\"url(#cowlShadowRight)\" stroke=\"#000000\" stroke-width=\"3\"/>\n\n  <!-- Angular Chiseled Cowl Nose Guard -->\n  <polygon points=\"250,210 234,272 250,284\" fill=\"url(#cowlLitLeft)\" stroke=\"#000000\" stroke-width=\"2.5\"/>\n  <polygon points=\"250,210 266,272 250,284\" fill=\"url(#cowlShadowRight)\" stroke=\"#000000\" stroke-width=\"2.5\"/>\n  <line x1=\"250\" y1=\"210\" x2=\"250\" y2=\"284\" stroke=\"rgba(255,255,255,0.5)\" stroke-width=\"1.5\"/>\n\n  <!-- HUMAN LOWER JAW IN COWL CUTOUT -->\n  <g id=\"human-jaw\" filter=\"url(#knightShadow)\">\n    <polygon points=\"250,284 178,290 188,385 250,420\" fill=\"url(#skinLit)\" stroke=\"#000000\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    <polygon points=\"250,284 322,290 312,385 250,420\" fill=\"url(#skinShadow)\" stroke=\"#000000\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    <polygon points=\"250,284 230,315 270,315\" fill=\"#7c2d12\" opacity=\"0.6\"/>\n\n    <!-- Stern Mouth & Chin Cleft -->\n    <line x1=\"215\" y1=\"352\" x2=\"285\" y2=\"352\" stroke=\"#451a03\" stroke-width=\"4.5\" stroke-linecap=\"round\"/>\n    <line x1=\"215\" y1=\"352\" x2=\"210\" y2=\"356\" stroke=\"#451a03\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <line x1=\"285\" y1=\"352\" x2=\"290\" y2=\"356\" stroke=\"#451a03\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <line x1=\"250\" y1=\"392\" x2=\"250\" y2=\"408\" stroke=\"#451a03\" stroke-width=\"3.5\" stroke-linecap=\"round\"/>\n    <line x1=\"232\" y1=\"416\" x2=\"250\" y2=\"420\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.5\"/>\n  </g>\n\n  <!-- Cowl Cutout Edge Bevel -->\n  <polyline points=\"178,290 188,385 250,420 312,385 322,290\" fill=\"none\" stroke=\"#020617\" stroke-width=\"6\"/>\n  <polyline points=\"178,290 250,284 322,290\" fill=\"none\" stroke=\"#020617\" stroke-width=\"5\"/>\n\n  <!-- LAYER 5: FOCAL FOREGROUND DETAILS (WHITE SLIT BAT-EYES) -->\n  <g filter=\"url(#eyeGlowFilter)\">\n    <polygon points=\"174,226 232,234 222,244 176,234\" fill=\"url(#eyeGlowGrad)\" stroke=\"#020617\" stroke-width=\"3.5\" stroke-linejoin=\"miter\"/>\n    <polygon points=\"326,226 268,234 278,244 324,234\" fill=\"url(#eyeGlowGrad)\" stroke=\"#020617\" stroke-width=\"3.5\" stroke-linejoin=\"miter\"/>\n    <line x1=\"184\" y1=\"230\" x2=\"224\" y2=\"236\" stroke=\"#ffffff\" stroke-width=\"1.5\"/>\n    <line x1=\"316\" y1=\"230\" x2=\"276\" y2=\"236\" stroke=\"#ffffff\" stroke-width=\"1.5\"/>\n  </g>\n\n  <!-- Master Specular 1px Edge Glints on Cowl Peaks -->\n  <path d=\"M 205,170 L 250,195 L 295,170\" fill=\"none\" stroke=\"rgba(255,255,255,0.4)\" stroke-width=\"1.2\"/>\n  <line x1=\"170\" y1=\"205\" x2=\"250\" y2=\"195\" stroke=\"rgba(255,255,255,0.35)\" stroke-width=\"1.2\"/>\n</svg>"}, "garfield": {"title": "Garfield (Classic Comic Art)", "baseline": "<svg viewBox=\"0 0 512 512\" xmlns=\"http://www.w3.org/2000/svg\">\n            <g id=\"garfield-baseline\" stroke=\"#18181b\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <!-- Left Ear (Freehand Path) -->\n              <path d=\"M140,165 C125,100 160,80 185,115 C200,135 205,160 205,175\" fill=\"#f97316\"/>\n              <path d=\"M152,150 C145,118 165,105 178,125\" fill=\"#fda4af\" stroke-width=\"4\"/>\n\n              <!-- Right Ear (Slightly asymmetric freehand Path) -->\n              <path d=\"M372,165 C388,100 350,82 328,115 C312,135 306,160 306,175\" fill=\"#f97316\"/>\n              <path d=\"M360,150 C368,118 348,105 334,125\" fill=\"#fda4af\" stroke-width=\"4\"/>\n\n              <!-- Main Head Oval -->\n              <ellipse cx=\"256\" cy=\"275\" rx=\"175\" ry=\"145\" fill=\"#fb923c\"/>\n\n              <!-- Forehead Stripes (Freehand simple black polygons) -->\n              <path d=\"M256,135 L250,175 L262,175 Z\" fill=\"#18181b\" stroke=\"none\"/>\n              <path d=\"M225,142 L228,172 L237,168 Z\" fill=\"#18181b\" stroke=\"none\"/>\n              <path d=\"M287,142 L284,172 L275,168 Z\" fill=\"#18181b\" stroke=\"none\"/>\n\n              <!-- Cheek Stripes Left -->\n              <path d=\"M90,265 L135,268 L110,285 Z\" fill=\"#18181b\" stroke=\"none\"/>\n              <path d=\"M96,298 L138,295 L116,312 Z\" fill=\"#18181b\" stroke=\"none\"/>\n\n              <!-- Cheek Stripes Right -->\n              <path d=\"M422,265 L377,268 L402,285 Z\" fill=\"#18181b\" stroke=\"none\"/>\n              <path d=\"M416,298 L374,295 L396,312 Z\" fill=\"#18181b\" stroke=\"none\"/>\n\n              <!-- Eyes (White large ovals) -->\n              <!-- Left Eye -->\n              <ellipse cx=\"218\" cy=\"225\" rx=\"44\" ry=\"62\" fill=\"#ffffff\"/>\n              <!-- Right Eye -->\n              <ellipse cx=\"294\" cy=\"225\" rx=\"44\" ry=\"62\" fill=\"#ffffff\"/>\n\n              <!-- Sleepy Eyelids (Orange covers top half) -->\n              <path d=\"M174,225 C174,180 200,165 218,165 C236,165 262,180 262,225 Z\" fill=\"#fb923c\"/>\n              <path d=\"M250,225 C250,180 276,165 294,165 C312,165 338,180 338,225 Z\" fill=\"#fb923c\"/>\n\n              <!-- Droopy Eyelid Lines -->\n              <line x1=\"174\" y1=\"225\" x2=\"262\" y2=\"225\" stroke=\"#18181b\" stroke-width=\"6\"/>\n              <line x1=\"250\" y1=\"225\" x2=\"338\" y2=\"225\" stroke=\"#18181b\" stroke-width=\"6\"/>\n\n              <!-- Pupils (Tiny black sleepy ovals near bottom) -->\n              <ellipse cx=\"225\" cy=\"242\" rx=\"7\" ry=\"11\" fill=\"#18181b\" stroke=\"none\"/>\n              <ellipse cx=\"287\" cy=\"242\" rx=\"7\" ry=\"11\" fill=\"#18181b\" stroke=\"none\"/>\n\n              <!-- Puffy Muzzle / Cheeks -->\n              <ellipse cx=\"205\" cy=\"318\" rx=\"60\" ry=\"46\" fill=\"#fed7aa\"/>\n              <ellipse cx=\"307\" cy=\"318\" rx=\"60\" ry=\"46\" fill=\"#fed7aa\"/>\n\n              <!-- Whisker Dots -->\n              <circle cx=\"185\" cy=\"312\" r=\"4\" fill=\"#18181b\" stroke=\"none\"/>\n              <circle cx=\"170\" cy=\"324\" r=\"4\" fill=\"#18181b\" stroke=\"none\"/>\n              <circle cx=\"192\" cy=\"332\" r=\"4\" fill=\"#18181b\" stroke=\"none\"/>\n\n              <circle cx=\"327\" cy=\"312\" r=\"4\" fill=\"#18181b\" stroke=\"none\"/>\n              <circle cx=\"342\" cy=\"324\" r=\"4\" fill=\"#18181b\" stroke=\"none\"/>\n              <circle cx=\"320\" cy=\"332\" r=\"4\" fill=\"#18181b\" stroke=\"none\"/>\n\n              <!-- Bulbous Pink Nose -->\n              <ellipse cx=\"256\" cy=\"272\ pPath>\n  </defs>\n\n  <!-- LAYER 0: ATMOSPHERE / BACKGROUND -->\n  <rect width=\"500\" height=\"500\" fill=\"#111318\"/>\n  <circle cx=\"250\" cy=\"250\" r=\"230\" fill=\"url(#backdropGlow)\"/>\n\n  <!-- LAYER 1: BACK SILHOUETTE (EARS) -->\n  <!-- Authentic small, rounded Garfield cat ears -->\n  <g stroke=\"#000000\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <!-- Left Ear (Center around 165, 115) -->\n    <path d=\"M 135,145 C 130,100 150,80 172,82 C 190,84 200,105 202,130\" fill=\"url(#bodyOrange)\"/>\n    <!-- Left Inner Ear Pink Pad -->\n    <path d=\"M 148,135 C 145,108 156,96 168,98 C 178,100 184,115 186,130\" fill=\"#ff99aa\" stroke-width=\"4\"/>\n    <!-- Left Ear Black Tabby Stripe on rim -->\n    <path d=\"M 134,120 L 148,124 L 138,136 Z\" fill=\"#000000\" stroke=\"none\"/>\n\n    <!-- Right Ear (Mirror: 500 - X) -->\n    <path d=\"M 365,145 C 370,100 350,80 328,82 C 310,84 300,105 298,130\" fill=\"url(#bodyOrange)\"/>\n    <!-- Right Inner Ear Pink Pad -->\n    <path d=\"M 352,135 C 355,108 344,96 332,98 C 322,100 316,115 314,130\" fill=\"#ff99aa\" stroke-width=\"4\"/>\n    <!-- Right Ear Black Tabby Stripe on rim -->\n    <path d=\"M 366,120 L 352,124 L 362,136 Z\" fill=\"#000000\" stroke=\"none\"/>\n  </g>\n\n  <!-- LAYER 2: MAIN SQUASHED OVAL HEAD -->\n  <g filter=\"url(#comicShadow)\" stroke=\"#000000\" stroke-width=\"6\" stroke-linejoin=\"round\">\n    <!-- Garfield's wide pumpkin/burger-bun head shape -->\n    <path d=\"M 250,118 \n             C 175,118 120,135 105,170\n             C 85,215 65,260 65,300\n             C 65,365 140,410 250,410\n             C 360,410 435,365 435,300\n             C 435,260 415,215 395,170\n             C 380,135 325,118 250,118 Z\" \n          fill=\"url(#bodyOrange)\"/>\n  </g>\n\n  <!-- LAYER 3: TABBY STRIPES -->\n  <g fill=\"#000000\">\n    <!-- Forehead 3 Classic Tiger Stripes -->\n    <!-- Center Stripe -->\n    <polygon points=\"250,122 243,165 257,165\"/>\n    <!-- Left For     function loadPreset(key) {
      const preset = PRESETS[key];
      if (!preset) return;
      document.getElementById('containerA').innerHTML = preset.baseline;
      document.getElementById('containerB').innerHTML = preset.architect;
      updateMetrics();
    }

    function toggleInspector(mode) {
      if (mode === 'grid') {
        const btn = document.getElementById('toggleGrid');
        const isGrid = document.body.classList.toggle('grid-active');
        btn.classList.toggle('active', isGrid);
      } else if (mode === 'wireframe') {
        const btn = document.getElementById('toggleWireframe');
        const isWire = document.body.classList.toggle('wireframe-active');
        btn.classList.toggle('active', isWire);
      }
    }

    function changeBackground(className) {
      ['wrapperA', 'wrapperB'].forEach(id => {
        const el = document.getElementById(id);
        el.className = 'canvas-wrapper ' + className;
      });
    }

    function updateMetrics() {
      calculateMetrics('containerA', 'nodesA', 'defsA', 'sizeA');
      calculateMetrics('containerB', 'nodesB', 'defsB', 'sizeB');
    }

    function calculateMetrics(containerId, nodesId, defsId, sizeId) {
      const container = document.getElementById(containerId);
      const svg = container.querySelector('svg');
      if (!svg) return;

      const allElements = svg.querySelectorAll('*');
      document.getElementById(nodesId).textContent = allElements.length;

      const defsChildren = svg.querySelectorAll('defs > *');
      document.getElementById(defsId).textContent = defsChildren.length;

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);
      const bytes = new TextEncoder().encode(svgString).length;
      document.getElementById(sizeId).textContent = bytes > 1024 
        ? (bytes / 1024).toFixed(2) + ' KB' 
        : bytes + ' B';
    }

    function copySvgCode(containerId, buttonEl) {
      const container = document.getElementById(containerId);
      const svg = container.querySelector('svg');
      if (!svg) return;

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);

      navigator.clipboard.writeText(svgString).then(() => {
        const originalText = buttonEl.textContent;
        buttonEl.textContent = 'Copied!';
        buttonEl.style.borderColor = '#10b981';
        buttonEl.style.color = '#34d399';
        setTimeout(() => {
          buttonEl.textContent = originalText;
          buttonEl.style.borderColor = '';
          buttonEl.style.color = '';
        }, 1800);
      }).catch(err => {
        console.error('Copy failed:', err);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPreset('bugs');
    });
  </script>
