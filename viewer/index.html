<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Architect: Interactive Benchmark & Gallery</title>
  <style>
    :root {
      --bg-dark: #090b10;
      --panel-bg: #121620;
      --card-bg: #181d2a;
      --border-color: #262e40;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --wireframe-stroke: #00ffcc;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand .tag {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #041019;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn, .select-input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.48rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn:hover, .select-input:hover {
      background: #202738;
      border-color: #3b4763;
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #041019;
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      width: 500px;
      max-width: 100%;
    }

    .card-header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-baseline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .badge-architect {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .canvas-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
      overflow: hidden;
      background: #07090e;
    }

    .bg-mode-dark { background-color: #07090e; }
    .bg-mode-light { background-color: #f8fafc; }
    .bg-mode-checker {
      background-color: #141824;
      background-image: 
        linear-gradient(45deg, #1f2538 25%, transparent 25%), 
        linear-gradient(-45deg, #1f2538 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #1f2538 75%), 
        linear-gradient(-45deg, transparent 75%, #1f2538 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Wireframe Mode */
    .wireframe-active .svg-container svg * {
      fill: none !important;
      stroke: var(--wireframe-stroke) !important;
      stroke-width: 1px !important;
      filter: none !important;
    }

    /* Mathematical Overlay Grid */
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    .grid-active .grid-overlay { display: block; }

    .card-footer {
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.25);
      padding: 0.75rem 1.25rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }

    .btn-copy { padding: 0.35rem 0.6rem; font-size: 0.75rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>SVG Architect</h1>
      <span class="tag">Benchmark Engine</span>
    </div>

    <div class="toolbar">
      <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">Preset Subject:</label>
      <select id="presetSelector" class="select-input" onchange="loadPreset(this.value)">
        <option value="bugs">Bugs Bunny (Looney Tunes Classic)</option>
        <option value="arthur">Arthur Morgan (RDR2 Poster Art)</option>
        <option value="spiderman">Spider-Man (Queens Web-Warrior)</option>
        <option value="batman">Batman (The Dark Knight Cowl)</option>
        <option value="garfield">Garfield (Classic Comic Art)</option>
      </select>

      <button id="toggleGrid" class="btn" onclick="toggleInspector('grid')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Grid Overlay
      </button>

      <button id="toggleWireframe" class="btn" onclick="toggleInspector('wireframe')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a15.3 15.3 0 0 1 4 9 15.3 15.3 0 0 1-4 9 15.3 15.3 0 0 1-4-9 15.3 15.3 0 0 1 4-9z"/></svg>
        Wireframe Mode
      </button>

      <select id="bgSelector" class="select-input" onchange="changeBackground(this.value)">
        <option value="bg-mode-dark">Canvas: Dark</option>
        <option value="bg-mode-light">Canvas: Light</option>
        <option value="bg-mode-checker">Canvas: Checkerboard</option>
      </select>
    </div>
  </header>

  <main>
    <!-- Card 1: Stage A Baseline -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>Stage A: Raw LLM Output</span>
          <span class="badge-baseline">Zero-Shot Baseline</span>
        </div>
        <button class="btn btn-copy" onclick="copySvgCode('containerA', this)">Copy SVG</button>
      </div>

      <div class="canvas-wrapper bg-mode-dark" id="wrapperA">
        <svg class="grid-overlay" viewBox="0 0 500 500">
          <defs>
            <pattern id="grid16A" width="16" height="16" patternUnits="userSpaceOnUse">
              <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            </pattern>
            <pattern id="grid64A" width="64" height="64" patternUnits="userSpaceOnUse">
              <rect width="64" height="64" fill="url(#grid16A)"/>
              <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="500" height="500" fill="url(#grid64A)"/>
          <line x1="250" y1="0" x2="250" y2="500" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <line x1="0" y1="250" x2="500" y2="250" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <circle cx="250" cy="250" r="3.5" fill="#ef4444"/>
        </svg>

        <div class="svg-container" id="containerA"></div>
      </div>

      <div class="card-footer">
        <div class="metric-item">
          <span class="metric-label">DOM Nodes</span>
          <span class="metric-value" id="nodesA">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Defs / Gradients</span>
          <span class="metric-value" id="defsA">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Payload Size</span>
          <span class="metric-value" id="sizeA">-</span>
        </div>
      </div>
    </div>

    <!-- Card 2: Stage B Distilled Architect System -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span>Stage B: SVG Architect</span>
          <span class="badge-architect">Spatial Blueprint Engine</span>
        </div>
        <button class="btn btn-copy" onclick="copySvgCode('containerB', this)">Copy SVG</button>
      </div>

      <div class="canvas-wrapper bg-mode-dark" id="wrapperB">
        <svg class="grid-overlay" viewBox="0 0 500 500">
          <defs>
            <pattern id="grid16B" width="16" height="16" patternUnits="userSpaceOnUse">
              <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
            </pattern>
            <pattern id="grid64B" width="64" height="64" patternUnits="userSpaceOnUse">
              <rect width="64" height="64" fill="url(#grid16B)"/>
              <path d="M 64 0 L 0 0 0 64" fill="none" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="500" height="500" fill="url(#grid64B)"/>
          <line x1="250" y1="0" x2="250" y2="500" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <line x1="0" y1="250" x2="500" y2="250" stroke="rgba(239,68,68,0.7)" stroke-width="1.5" stroke-dasharray="4,4"/>
          <circle cx="250" cy="250" r="3.5" fill="#ef4444"/>
        </svg>

        <div class="svg-container" id="containerB"></div>
      </div>

      <div class="card-footer">
        <div class="metric-item">
          <span class="metric-label">DOM Nodes</span>
          <span class="metric-value" id="nodesB">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Defs / Gradients</span>
          <span class="metric-value" id="defsB">-</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Payload Size</span>
          <span class="metric-value" id="sizeB">-</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const PRESETS = {"bugs": {"title": "Bugs Bunny (Looney Tunes Classic)", "baseline": "<!-- Stage A: Raw/Zero-Shot Bugs Bunny Baseline -->
          <svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">
            <g id=\"bugs-baseline\" stroke=\"#000000\" stroke-width=\"3\" stroke-linejoin=\"round\">
              <!-- Looney Tunes Red Target -->
              <rect width=\"500\" height=\"500\" fill=\"#1e293b\"/>
              <circle cx=\"250\" cy=\"250\" r=\"220\" fill=\"#dc2626\"/>
              <circle cx=\"250\" cy=\"250\" r=\"160\" fill=\"#ea580c\"/>
              <circle cx=\"250\" cy=\"250\" r=\"100\" fill=\"#fbbf24\"/>

              <!-- Ears (Freehand flat grey & pink) -->
              <path d=\"M 210,100 C 180,20 160,10 170,10 C 180,10 210,50 225,100 Z\" fill=\"#94a3b8\"/>
              <path d=\"M 180,30 C 185,25 200,60 215,95\" stroke=\"#f472b6\" stroke-width=\"6\"/>

              <path d=\"M 275,100 C 290,50 320,10 330,10 C 340,10 320,20 290,100 Z\" fill=\"#94a3b8\"/>
              <path d=\"M 320,30 C 315,25 300,60 285,95\" stroke=\"#f472b6\" stroke-width=\"6\"/>

              <!-- Body -->
              <path d=\"M 200,280 L 170,420 L 330,420 L 300,280 Z\" fill=\"#94a3b8\"/>
              <ellipse cx=\"250\" cy=\"350\" rx=\"35\" ry=\"50\" fill=\"#ffffff\"/>

              <!-- Head -->
              <ellipse cx=\"250\" cy=\"180\" rx=\"60\" ry=\"70\" fill=\"#94a3b8\"/>
              <!-- Cheeks -->
              <circle cx=\"205\" cy=\"210\" r=\"30\" fill=\"#ffffff\"/>
              <circle cx=\"295\" cy=\"210\" r=\"30\" fill=\"#ffffff\"/>

              <!-- Buck Teeth -->
              <rect x=\"242\" y=\"225\" width=\"8\" height=\"15\" fill=\"#ffffff\"/>
              <rect x=\"250\" y=\"225\" width=\"8\" height=\"15\" fill=\"#ffffff\"/>

              <!-- Nose -->
              <ellipse cx=\"250\" cy=\"195\" rx=\"8\" ry=\"6\" fill=\"#f472b6\"/>

              <!-- Eyes -->
              <ellipse cx=\"235\" cy=\"150\" rx=\"10\" ry=\"18\" fill=\"#ffffff\"/>
              <circle cx=\"238\" cy=\"152\" r=\"4\" fill=\"#000000\"/>
              <ellipse cx=\"265\" cy=\"150\" rx=\"10\" ry=\"18\" fill=\"#ffffff\"/>
              <circle cx=\"262\" cy=\"152\" r=\"4\" fill=\"#000000\"/>

              <!-- Carrot -->
              <polygon points=\"320,280 380,240 370,230\" fill=\"#ea580c\"/>
              <path d=\"M 380,240 L 405,225\" stroke=\"#22c55e\" stroke-width=\"4\"/>
            </g>
          </svg>", "architect": "<!-- Stage B: Distilled Architect System Output (Bugs Bunny Masterpiece) -->
          <!--
            Coordinate & Layer Plan:
            Canvas: 500x500 | Origin: Center (250, 250) | Symmetry Axis: X=250
            Anatomical Lock: Bugs Bunny (Looney Tunes Concentric Rings, Tall Ears, Fluffy Cheeks, Buck Teeth, Carrot)
            Hierarchy:
              L0: Atmosphere & Iconic Concentric Warner Bros Target Rings (#7f1d1d, #c2410c, #d97706, #fbbf24)
              L1: Slender Gray Rabbit Torso & White Tummy Fur with Relaxed Hip Stance
              L2: Arms with White 4-Fingered Gloves & The Crunchy Orange Carrot (#ea580c + leafy green sprig)
              L3: Head Cranium & Symmetrical Tall Expressive Rabbit Ears (Left [165, 18] <-> Right [335, 18])
              L4: Fluffy White Cheeks, Split Muzzle, Iconic Buck Teeth & Pink Nose at [250, 175]
              L5: Mischievous Lidded Eyes with Specular Glints & Whisker Whisk Details
          -->
          <svg viewBox=\"0 0 500 500\" xmlns=\"http://www.w3.org/2000/svg\">
            <defs>
              <!-- Target Bullseye Gradients -->
              <radialGradient id=\"wbTargetGlow\" cx=\"50%\" cy=\"48%\" r=\"52%\">
                <stop offset=\"0%\" stop-color=\"#fef08a\"/>
                <stop offset=\"28%\" stop-color=\"#f59e0b\"/>
                <stop offset=\"55%\" stop-color=\"#ea580c\"/>
                <stop offset=\"78%\" stop-color=\"#b91c1c\"/>
                <stop offset=\"100%\" stop-color=\"#450a0a\"/>
              </radialGradient>

              <!-- Bugs Bunny Slate-Gray Fur (Left-Lit vs Right-Shadow) -->
              <linearGradient id=\"bunnyGrayLit\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#cbd5e1\"/>
                <stop offset=\"35%\" stop-color=\"#94a3b8\"/>
                <stop offset=\"100%\" stop-color=\"#64748b\"/>
              </linearGradient>

              <linearGradient id=\"bunnyGrayShadow\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#64748b\"/>
                <stop offset=\"60%\" stop-color=\"#475569\"/>
                <stop offset=\"100%\" stop-color=\"#334155\"/>
              </linearGradient>

              <!-- Inner Ear Pink Gradients -->
              <linearGradient id=\"earPinkLit\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#fce7f3\"/>
                <stop offset=\"45%\" stop-color=\"#f472b6\"/>
                <stop offset=\"100%\" stop-color=\"#db2777\"/>
              </linearGradient>

              <!-- Fluffy White Fur & Glove Shading -->
              <radialGradient id=\"whiteFurGrad\" cx=\"45%\" cy=\"35%\" r=\"65%\">
                <stop offset=\"0%\" stop-color=\"#ffffff\"/>
                <stop offset=\"65%\" stop-color=\"#f8fafc\"/>
                <stop offset=\"100%\" stop-color=\"#e2e8f0\"/>
              </radialGradient>

              <!-- Crunchy Carrot Gradients -->
              <linearGradient id=\"carrotGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#fed7aa\"/>
                <stop offset=\"30%\" stop-color=\"#fb923c\"/>
                <stop offset=\"75%\" stop-color=\"#ea580c\"/>
                <stop offset=\"100%\" stop-color=\"#9a3412\"/>
              </linearGradient>

              <!-- Leafy Green Carrot Top -->
              <linearGradient id=\"leafGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#4ade80\"/>
                <stop offset=\"60%\" stop-color=\"#16a34a\"/>
                <stop offset=\"100%\" stop-color=\"#14532d\"/>
              </linearGradient>

              <!-- Nose Pink Gradient -->
              <radialGradient id=\"bunnyNose\" cx=\"40%\" cy=\"30%\" r=\"70%\">
                <stop offset=\"0%\" stop-color=\"#ffe4e6\"/>
                <stop offset=\"45%\" stop-color=\"#f43f5e\"/>
                <stop offset=\"100%\" stop-color=\"#be123c\"/>
              </radialGradient>

              <!-- Cartoon Drop Shadows -->
              <filter id=\"looneyShadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">
                <feDropShadow dx=\"0\" dy=\"12\" stdDeviation=\"12\" flood-color=\"#000000\" flood-opacity=\"0.6\"/>
              </filter>
            </defs>

            <!-- =================================================== -->
            <!-- LAYER 0: CONCENTRIC LOONEY TUNES TARGET BULLSEYE    -->
            <!-- =================================================== -->
            <rect width=\"500\" height=\"500\" fill=\"#180404\"/>
            <!-- Concentric Bullseye Rings -->
            <circle cx=\"250\" cy=\"250\" r=\"235\" fill=\"url(#wbTargetGlow)\"/>
            <circle cx=\"250\" cy=\"250\" r=\"195\" fill=\"none\" stroke=\"#b91c1c\" stroke-width=\"14\"/>
            <circle cx=\"250\" cy=\"250\" r=\"150\" fill=\"none\" stroke=\"#ea580c\" stroke-width=\"14\"/>
            <circle cx=\"250\" cy=\"250\" r=\"105\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"12\"/>
            <circle cx=\"250\" cy=\"250\" r=\"62\" fill=\"#7f1d1d\" opacity=\"0.65\"/>

            <!-- =================================================== -->
            <!-- LAYER 1: SLENDER BODY, LEGS & WHITE TUMMY FUR       -->
            <!-- Shoulders [185, 290] <-> [315, 290]                 -->
            <!-- =================================================== -->
            <g id=\"layer1-bunny-body\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">
              <!-- Slender Torso -->
              <!-- Left Torso Half (Lit) -->
              <path d=\"M 235,255 L 185,290 L 175,395 L 210,480 L 250,485 Z\" fill=\"url(#bunnyGrayLit)\"/>
              <!-- Right Torso Half (Shadow: Mirror 500 - X) -->
              <path d=\"M 265,255 L 315,290 L 325,395 L 290,480 L 250,485 Z\" fill=\"url(#bunnyGrayShadow)\"/>

              <!-- Fluffy White Oval Tummy Patch -->
              <ellipse cx=\"250\" cy=\"385\" rx=\"42\" ry=\"72\" fill=\"url(#whiteFurGrad)\" stroke=\"#090d16\" stroke-width=\"4\"/>

              <!-- Relaxed Rabbit Feet Base -->
              <path d=\"M 170,480 C 135,480 120,495 140,500 L 225,500 C 235,492 215,480 170,480 Z\" fill=\"url(#whiteFurGrad)\"/>
              <path d=\"M 330,480 C 365,480 380,495 360,500 L 275,500 C 265,492 285,480 330,480 Z\" fill=\"url(#whiteFurGrad)\"/>
            </g>

            <!-- =================================================== -->
            <!-- LAYER 2: ARMS, WHITE GLOVES & CRUNCHY CARROT        -->
            <!-- =================================================== -->
            <g id=\"layer2-arms-carrot\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">
              <!-- Left Arm (Hand on Hip with Attitude) -->
              <path d=\"M 185,290 C 145,320 135,365 155,405\" fill=\"none\"/>
              <!-- Left 4-Fingered White Cartoon Glove -->
              <ellipse cx=\"158\" cy=\"405\" rx=\"16\" ry=\"14\" fill=\"url(#whiteFurGrad)\"/>
              <!-- Glove Dart Seams -->
              <line x1=\"152\" y1=\"398\" x2=\"164\" y2=\"410\" stroke=\"#64748b\" stroke-width=\"2\"/>

              <!-- Right Arm (Raised casually holding the carrot) -->
              <path d=\"M 315,290 C 355,310 380,285 365,245\" fill=\"none\"/>

              <!-- THE CRUNCHY CARROT! -->
              <g id=\"carrot-prop\">
                <!-- Carrot Body -->
                <polygon points=\"352,248 425,185 415,172 345,236\" fill=\"url(#carrotGrad)\"/>
                <!-- Carrot Crunchy Horizontal Grooves -->
                <line x1=\"365\" y1=\"230\" x2=\"378\" y2=\"236\" stroke=\"#9a3412\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>
                <line x1=\"385\" y1=\"212\" x2=\"398\" y2=\"218\" stroke=\"#9a3412\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>
                <line x1=\"402\" y1=\"195\" x2=\"412\" y2=\"200\" stroke=\"#9a3412\" stroke-width=\"2\" stroke-linecap=\"round\"/>

                <!-- Leafy Green Carrot Top Sprig -->
                <path d=\"M 420,178 C 435,160 455,165 445,150 C 430,158 432,142 418,155 C 414,142 398,152 412,172 Z\" fill=\"url(#leafGrad)\"/>
              </g>

              <!-- Right Gloved Hand Gripping the Carrot -->
              <ellipse cx=\"355\" cy=\"242\" rx=\"15\" ry=\"13\" fill=\"url(#whiteFurGrad)\"/>
              <circle cx=\"348\" cy=\"236\" r=\"6\" fill=\"url(#whiteFurGrad)\"/>
              <circle cx=\"355\" cy=\"232\" r=\"6\" fill=\"url(#whiteFurGrad)\"/>
              <circle cx=\"363\" cy=\"235\" r=\"6\" fill=\"url(#whiteFurGrad)\"/>
            </g>

            <!-- =================================================== -->
            <!-- LAYER 3: TALL EARS & SLENDER CRANIUM                -->
            <!-- Symmetrical Ears: Left [165, 18] <-> Right [335, 18]-->
            <!-- =================================================== -->
            <g id=\"layer3-ears-head\" filter=\"url(#looneyShadow)\" stroke=\"#090d16\" stroke-width=\"4.5\" stroke-linejoin=\"round\">
              <!-- LEFT TALL RABBIT EAR -->
              <path d=\"M 215,85 
                       C 190,50 145,35 165,18 
                       C 188,2 215,35 230,85 Z\" 
                    fill=\"url(#bunnyGrayLit)\"/>
              <!-- Left Inner Pink Well -->

    function loadPreset(key) {
      const preset = PRESETS[key];
      if (!preset) return;
      document.getElementById('containerA').innerHTML = preset.baseline;
      document.getElementById('containerB').innerHTML = preset.architect;
      updateMetrics();
    }

    function toggleInspector(mode) {
      if (mode === 'grid') {
        const btn = document.getElementById('toggleGrid');
        const isGrid = document.body.classList.toggle('grid-active');
        btn.classList.toggle('active', isGrid);
      } else if (mode === 'wireframe') {
        const btn = document.getElementById('toggleWireframe');
        const isWire = document.body.classList.toggle('wireframe-active');
        btn.classList.toggle('active', isWire);
      }
    }

    function changeBackground(className) {
      ['wrapperA', 'wrapperB'].forEach(id => {
        const el = document.getElementById(id);
        el.className = 'canvas-wrapper ' + className;
      });
    }

    function updateMetrics() {
      calculateMetrics('containerA', 'nodesA', 'defsA', 'sizeA');
      calculateMetrics('containerB', 'nodesB', 'defsB', 'sizeB');
    }

    function calculateMetrics(containerId, nodesId, defsId, sizeId) {
      const container = document.getElementById(containerId);
      const svg = container.querySelector('svg');
      if (!svg) return;

      const allElements = svg.querySelectorAll('*');
      document.getElementById(nodesId).textContent = allElements.length;

      const defsChildren = svg.querySelectorAll('defs > *');
      document.getElementById(defsId).textContent = defsChildren.length;

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);
      const bytes = new TextEncoder().encode(svgString).length;
      document.getElementById(sizeId).textContent = bytes > 1024 
        ? (bytes / 1024).toFixed(2) + ' KB' 
        : bytes + ' B';
    }

    function copySvgCode(containerId, buttonEl) {
      const container = document.getElementById(containerId);
      const svg = container.querySelector('svg');
      if (!svg) return;

      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);

      navigator.clipboard.writeText(svgString).then(() => {
        const originalText = buttonEl.textContent;
        buttonEl.textContent = 'Copied!';
        buttonEl.style.borderColor = '#10b981';
        buttonEl.style.color = '#34d399';
        setTimeout(() => {
          buttonEl.textContent = originalText;
          buttonEl.style.borderColor = '';
          buttonEl.style.color = '';
        }, 1800);
      }).catch(err => {
        console.error('Copy failed:', err);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadPreset('bugs');
    });
  </script>
