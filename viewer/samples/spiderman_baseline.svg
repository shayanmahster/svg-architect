<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <g id="spiderman-baseline" stroke="#000000" stroke-width="4" stroke-linejoin="round">
              <!-- Background -->
              <rect width="500" height="500" fill="#1e293b"/>
              <circle cx="250" cy="250" r="180" fill="#0284c7" opacity="0.4"/>

              <!-- Shoulders -->
              <path d="M 100,480 L 160,390 L 340,390 L 400,480 Z" fill="#ef4444"/>

              <!-- Head Base (Flat red oval) -->
              <ellipse cx="250" cy="260" rx="140" ry="170" fill="#dc2626"/>

              <!-- Simple Freehand Web Lines -->
              <line x1="250" y1="90" x2="250" y2="430" stroke="#18181b" stroke-width="2.5"/>
              <line x1="110" y1="260" x2="390" y2="260" stroke="#18181b" stroke-width="2.5"/>
              <line x1="150" y1="140" x2="350" y2="380" stroke="#18181b" stroke-width="2.5"/>
              <line x1="150" y1="380" x2="350" y2="140" stroke="#18181b" stroke-width="2.5"/>

              <!-- Rough Web Arcs -->
              <ellipse cx="250" cy="260" rx="60" ry="70" fill="none" stroke="#18181b" stroke-width="2"/>
              <ellipse cx="250" cy="260" rx="100" ry="120" fill="none" stroke="#18181b" stroke-width="2"/>

              <!-- Eyes (Simple Flat White Triangles with Black Border) -->
              <polygon points="140,180 230,230 160,280" fill="#ffffff" stroke="#000000" stroke-width="10"/>
              <polygon points="360,180 270,230 340,280" fill="#ffffff" stroke="#000000" stroke-width="10"/>
            </g>
          </svg>