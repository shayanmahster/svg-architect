<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <g id="batman-baseline" stroke="#000000" stroke-width="4" stroke-linejoin="round">
              <!-- Background -->
              <rect width="500" height="500" fill="#1e293b"/>
              <circle cx="250" cy="250" r="180" fill="#334155"/>

              <!-- Cape / Shoulders -->
              <path d="M 80,480 L 170,390 L 330,390 L 420,480 Z" fill="#0f172a"/>

              <!-- Cowl & Ears (Freehand flat path with asymmetry) -->
              <path d="M 150,110 L 140,40 L 180,95 L 320,95 L 360,40 L 350,110 L 375,250 L 340,380 L 160,380 L 125,250 Z" 
                    fill="#18181b"/>

              <!-- Cowl Eye Openings -->
              <polygon points="180,225 230,235 220,245 175,235" fill="#ffffff" stroke="#000000" stroke-width="3"/>
              <polygon points="320,225 270,235 280,245 325,235" fill="#ffffff" stroke="#000000" stroke-width="3"/>

              <!-- Nose Guard (Simple flat triangle) -->
              <polygon points="250,220 235,275 265,275" fill="#27272a"/>

              <!-- Mouth Cutout (Flat Skin Polygon) -->
              <polygon points="185,295 240,285 260,285 315,295 305,385 250,405 195,385" fill="#fed7aa"/>

              <!-- Mouth Line -->
              <line x1="220" y1="350" x2="280" y2="350" stroke="#000000" stroke-width="3"/>
              <!-- Chin line -->
              <line x1="240" y1="380" x2="260" y2="380" stroke="#000000" stroke-width="2"/>
            </g>
          </svg>