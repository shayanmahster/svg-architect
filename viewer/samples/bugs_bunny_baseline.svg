<!-- Stage A: Raw/Zero-Shot Bugs Bunny Baseline -->
          <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <g id="bugs-baseline" stroke="#000000" stroke-width="3" stroke-linejoin="round">
              <!-- Looney Tunes Red Target -->
              <rect width="500" height="500" fill="#1e293b"/>
              <circle cx="250" cy="250" r="220" fill="#dc2626"/>
              <circle cx="250" cy="250" r="160" fill="#ea580c"/>
              <circle cx="250" cy="250" r="100" fill="#fbbf24"/>

              <!-- Ears (Freehand flat grey & pink) -->
              <path d="M 210,100 C 180,20 160,10 170,10 C 180,10 210,50 225,100 Z" fill="#94a3b8"/>
              <path d="M 180,30 C 185,25 200,60 215,95" stroke="#f472b6" stroke-width="6"/>

              <path d="M 275,100 C 290,50 320,10 330,10 C 340,10 320,20 290,100 Z" fill="#94a3b8"/>
              <path d="M 320,30 C 315,25 300,60 285,95" stroke="#f472b6" stroke-width="6"/>

              <!-- Body -->
              <path d="M 200,280 L 170,420 L 330,420 L 300,280 Z" fill="#94a3b8"/>
              <ellipse cx="250" cy="350" rx="35" ry="50" fill="#ffffff"/>

              <!-- Head -->
              <ellipse cx="250" cy="180" rx="60" ry="70" fill="#94a3b8"/>
              <!-- Cheeks -->
              <circle cx="205" cy="210" r="30" fill="#ffffff"/>
              <circle cx="295" cy="210" r="30" fill="#ffffff"/>

              <!-- Buck Teeth -->
              <rect x="242" y="225" width="8" height="15" fill="#ffffff"/>
              <rect x="250" y="225" width="8" height="15" fill="#ffffff"/>

              <!-- Nose -->
              <ellipse cx="250" cy="195" rx="8" ry="6" fill="#f472b6"/>

              <!-- Eyes -->
              <ellipse cx="235" cy="150" rx="10" ry="18" fill="#ffffff"/>
              <circle cx="238" cy="152" r="4" fill="#000000"/>
              <ellipse cx="265" cy="150" rx="10" ry="18" fill="#ffffff"/>
              <circle cx="262" cy="152" r="4" fill="#000000"/>

              <!-- Carrot -->
              <polygon points="320,280 380,240 370,230" fill="#ea580c"/>
              <path d="M 380,240 L 405,225" stroke="#22c55e" stroke-width="4"/>
            </g>
          </svg>