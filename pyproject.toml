[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-architect"
version = "0.1.0"
description = "Deterministic Spatial Blueprint Engine for Production-Grade Generative Vector Graphics (SVGs) with LLMs"
readme = "README.md"
authors = [{ name = "Maher & Antigravity" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
svg-architect = "svg_architect.cli:main"
