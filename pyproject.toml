[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-architect"
version = "0.2.0"
description = "Deterministic Spatial Blueprint & Multi-Pass Synthesis Engine for Generative Vector Graphics (SVGs)"
readme = "README.md"
authors = [{ name = "Shayan Master (@shayanmahster)" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
svg-architect = "svg_architect.cli:main"

[tool.setuptools.packages.find]
include = ["svg_architect*"]

[tool.setuptools.package-data]
svg_architect = ["*"]
